; CYD (Cheap Yellow Display) ESP32-2432S028R
; Classic ESP32-WROOM-32, ILI9341 320x240 TFT, XPT2046 resistive touch
;
;   USB:  pio run -t upload
;   OTA:  pio run -e cyd-ota -t upload        (device must be on Wi-Fi)

[platformio]
default_envs = cyd

; Password the device requires for over-the-air updates. Change it, then flash
; once over USB so the device knows the new one. Letters, digits and _ only.
[ota]
password = cyd_ota_change_me
hostname = tacklebox.local

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The CH340 USB-serial chip on the CYD is unreliable at 921600 on macOS
upload_speed = 460800
monitor_filters = esp32_exception_decoder
; Two 1.9 MB app slots so OTA can write the new firmware while the old one runs
; (plus 128 KB SPIFFS). NVS sits at the same offset as before, so settings survive.
board_build.partitions = min_spiffs.csv
; Fails the build if firmware.bin won't fit an OTA slot (see tools/check_size.py)
extra_scripts = post:tools/check_size.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.0
    h2zero/NimBLE-Arduino@^2.3.0

build_flags =
    ; ---- OTA ----
    -DOTA_PASSWORD=${ota.password}
    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---- TFT_eSPI (configured here instead of editing User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; ESP32 SPI clock is 80 MHz / n, so 40 MHz is what 55 MHz actually ran at
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    ; ---- NimBLE: the app only scans (observer role). Leaving out the client,
    ; server and advertising code keeps firmware.bin inside the OTA slot. ----
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

; Same firmware, uploaded over Wi-Fi with espota. The device asks for approval
; first, so a patched copy of espota.py (made by tools/espota_patch.py, a post
; script that points the platform's espota uploader at it) waits up to 45 s for
; the device instead of the stock 10 s. (upload_protocol = custom didn't work:
; PlatformIO switches any host-name upload_port back to espota.)
[env:cyd-ota]
extends = env:cyd
extra_scripts =
    post:tools/espota_patch.py
    post:tools/check_size.py
upload_protocol = espota
upload_port = ${ota.hostname}
upload_flags =
    --auth=${ota.password}
