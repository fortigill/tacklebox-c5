; CYD (Cheap Yellow Display) ESP32-2432S028R
; Classic ESP32-WROOM-32, ILI9341 320x240 TFT, XPT2046 resistive touch
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; The CH340 USB-serial chip on the CYD is unreliable at 921600 on macOS
upload_speed = 460800
monitor_filters = esp32_exception_decoder
; LVGL + WiFi doesn't fit in the default 1.25 MB app partition
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@~8.3.11

build_flags =
    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---- TFT_eSPI (configured here instead of editing User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; ESP32 SPI clock is 80 MHz / n, so 40 MHz is what 55 MHz actually ran at
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
